name: Forecast runtime validation

on:
  push:
    paths:
      - "jobs/**"
      - "ml/train_forecast.py"
      - "ml/artifacts/**"
      - ".github/workflows/forecast.yml"
      - ".github/workflows/forecast-runtime.yml"
  pull_request:
    paths:
      - "jobs/**"
      - "ml/train_forecast.py"
      - "ml/artifacts/**"
      - ".github/workflows/forecast.yml"
      - ".github/workflows/forecast-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r jobs/requirements.txt'
      - run: python -m pip check
      - run: python -B -m unittest discover -s jobs/tests
      - run: python -B jobs/forecast_runtime.py
